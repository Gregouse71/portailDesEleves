#/etc/nginx/sites-available/site
# Configuration de nginx sur la VM hébergeant le site

server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Pour les gros fichiers
        client_max_body_size 400M;

        server_name _ eleves.rezal-mdm.com eleves.mines-paris.eu;

        location /api {
                add_header       X-Served-By        $host;
                proxy_set_header Host               $host;
                proxy_set_header X-Real-IP          $http_x_real_ip;
                proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Scheme $http_x_forwarded_scheme;
                proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
                proxy_set_header X-Forwarded-Host   $http_x_forwarded_host;
                proxy_set_header X-Forwarded-Port   $http_x_forwarded_port;

                proxy_pass http://backend:5000$request_uri;
        }

        location /socket.io {
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 86400;
                proxy_send_timeout 86400;

                proxy_set_header X-Accel-Buffering  no;
                proxy_http_version 1.1;
                proxy_set_header Upgrade            $http_upgrade;
                proxy_set_header Connection         "upgrade";

                proxy_set_header Host               $host;
                proxy_set_header X-Real-IP          $http_x_real_ip;
                proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Scheme $http_x_forwarded_scheme;
                proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
                proxy_set_header X-Forwarded-Host   $http_x_forwarded_host;
                proxy_set_header X-Forwarded-Port   $http_x_forwarded_port;

                proxy_pass http://backend:5000;
        }

        location /upload {
                alias /app/upload;
        }

        root /usr/share/nginx/html;
        index index.html;

        location / {
                try_files $uri $uri/ /index.html;
        }
}

server {
        listen 80;
        listen [::]:80;

        server_name mines-paris.eu;

        location / {
                return 301 https://eleves.mines-paris.eu/public$request_uri;
        }
}
